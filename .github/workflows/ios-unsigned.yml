name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project HongguoIOS.xcodeproj \
            -scheme HongguoIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload HongguoIOS-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HongguoIOS.app Payload/
          zip -qry HongguoIOS-unsigned.ipa Payload

      - name: Package ad-hoc signed IPA
        run: |
          rm -rf Payload-AdHoc
          mkdir -p Payload-AdHoc
          cp -R build/Build/Products/Release-iphoneos/HongguoIOS.app Payload-AdHoc/
          codesign --force --deep --sign - Payload-AdHoc/HongguoIOS.app
          cd Payload-AdHoc
          zip -qry ../HongguoIOS-adhoc.ipa HongguoIOS.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HongguoIOS-builds
          path: |
            HongguoIOS-unsigned.ipa
            HongguoIOS-adhoc.ipa
