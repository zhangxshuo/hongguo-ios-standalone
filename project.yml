name: HongguoIOS

options:
  bundleIdPrefix: cn.guoban
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: cn.guoban.hongguo.ios
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  HongguoIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: HongguoIOS
        SWIFT_OBJC_BRIDGING_HEADER: Vendor/hongguo_signer.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/Vendor/libhongguo_standalone_signer.a
          - -lc++
          - -lz
          - -framework
          - CoreFoundation
